# house-pause-options — see trace.jsonl.  Opens the in-game PAUSE menu,
# navigates to the OPTIONS entry (type 2, index 2 in the house list
# [1,6,2,3,4]) and presses Z to open the type-2 options submenu (engine
# FUN_0047fc44 update / FUN_0048150c→FUN_0049c050 render, dispatched from
# FUN_0047fa76 / FUN_004820ba at sub_anim==10 / sub_anim>0).
#
# Synthesised for the PAUSE-MENU options arc (docs/plans/pause-menu.md M3+).
# The nav + caprange re-anchor to PAUSE_READY so retail's slower pause-asset load
# finishes before the first nav input (load-seam-immune; the v3 identity-join
# pairs the submenu frames by (PAUSE_READY, offset)).
description: |
  Pause → 2×down to OPTIONS → Z opens the type-2 submenu; then (rebased on
  OPTIONS_READY) drive the config-panel nav — cursor down through all 5 rows +
  change Sound / Message Speed / Unread Text Skip.  Capture the OPTIONS_READY
  +0..300 extent for the port↔retail diff (drive with --anchor OPTIONS_READY).
  Pinned (phasepin 80) so the pre-ESC free-roam matches 1:1.
max_frames: 22000   # turbo load-stretch headroom (matches house-pause)
duration_ceiling_ms: 180000
