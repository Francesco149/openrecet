# house-idle-npc-drift — README house hero (docs/img/hero-house-freeroam.png).
#
# Reuses house-walk-tables' proven new-game -> 2x HOUSE_FREEROAM prefix (spam-Z
# through title / intro / iv1_1 / iv1_2 dialogue), reaching the REAL free-roam
# anchor (HF#2). Then it IDLES (no movement input) so Recette stays at her
# bottom spawn, and sweeps captures at HF#2 +60..+1560 (every 60) to find the
# frame where the back-window NPC is on screen. bg_npc motion is deterministic
# (seed=1) at a fixed anchor offset, so the chosen cap is reproducible.
#
# This is a HERO scenario, not a regression bench. Regenerate the hero with:
#
#   nix develop --command python3 tools/heroes/regen-heroes.py \
#     --shot hero-house-freeroam --push
#
# which drives it --target openrecet (the port only, no Frida) and writes the
# OpenRecet screenshot docs/img/hero-house-freeroam.png. The NPC-visible cap
# index is pinned in tools/heroes/heroes.yaml (cap 0).

description: |
  HOUSE real free-roam, Recette idle at the bottom, back-window NPC on screen.
  README house hero (docs/img/hero-house-freeroam.png). Sweeps HF#2 +60..+1560
  to locate the NPC-visible cap.

max_frames: 22000  # retail turbo load-stretch: 2nd HOUSE_FREEROAM lands ~15400; capture offset needs headroom
duration_ceiling_ms: 180000
n_captures: 6
