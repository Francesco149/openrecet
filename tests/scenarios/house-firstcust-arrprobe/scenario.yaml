      scope: "HOUSE_FREEROAM#1 [1,80] every frame — tex d44541872da3b494, 80 tris, 0 px painted, retail-only (first draw)"
      reason: "Benign warm-up strip: retail draws an 80-triangle degenerate/off-screen strip that paints 0 px on every HOUSE_FREEROAM frame (FRONT 'tex b494 80tris retail-only'); the port omits it.  Pixels are human-confirmed 1:1.  Recorded for review; the gate does NOT auto-tolerate it (exceptions stay descriptive until EP-07 bridges human review), so render_program still FAILs here — honest."
      approved_by: "R3-review-2026-07-16"
