# Phase A scenario: title boot → press Z (button A) at frame 30.
#
# This was the user-visible symptom of the 2026-05-21 input-bypass bug
# fixed by 520a349 (build-system header dep tracking): arrows + Z did
# nothing in the title menu. With this scenario in place, that class
# of failure (sim consumes input → never sets select_phase) shows up
# as a pixel mismatch on the dispatch frame.
#
# Default cursor on a fresh boot is item 0 (NEW GAME). The select
# countdown takes 14 frames to reach 0xf, so the dispatch frame is
# 30 + 14 = 44. main.c's pending_action handler logs "menu item 0
# selected — destination scene not ported yet" and snaps select_phase
# back to 0; subsequent frames show the BG scroll continuing.
#
# Captures:
#   0   — baseline title-screen identical to boot-idle
#   30  — A just pressed, select_phase=1
#   35  — mid-countdown, cursor brightness fading
#   44  — dispatch frame; NEW_GAME selected → title.fade_counter starts at 1
#   50  — mid-freeze (title.fade_counter ≈ 7); identical to dispatch, title frozen
#   73  — fade-quad init: title.fade_counter hits 0x1e → fade_phase1_start(0, 0x11);
#         end-of-sim fade_tick advances g_fade_counter to 2 → alpha ≈ 34
#   74  — alpha ≈ 51 (counter=3)
#   80  — mid-fade, alpha ≈ 153 (counter=9)   — dmean vs frame 50 ≈ 124
#   85  — late fade, alpha ≈ 239 (counter=14) — dmean ≈ 193
#   90  — fully clamped, alpha = 255           — dmean ≈ 207 (solid black)
#   95  — post-transition: g_scene_state = LOADING; fade quad keeps drawing
#         (counter pinned at duration+1 = 18) so screen stays solid black
#
# Alpha formula (FUN_00453e8f, recovered from objdump — Ghidra mis-decomp drops
# the `256.0 / (duration-2)` factor): alpha = (int)(256/15 * counter), clamped
# to [0, 255]. See docs/findings/title-fade-out.md.
#
# Frame-count math: A-press at 30 → 14 ticks for select_phase 1..0xf → dispatch
# at 44 → title.fade_counter (DAT_0964351c) ticks 1..30 across frames 44..73 →
# scene_title_sim calls fade_phase1_start(0, 0x11) on frame 73 → g_fade_counter
# (DAT_0438bf78) ticked by sim_step_a tail (FUN_004526ab); per-frame value lands
# at counter=2 on frame 73 and rises by 1/frame until clamped at 18. fade_is_done
# returns 1 when counter == 17 → g_scene_state transitions to LOADING (engine
# would then dispatch destination scene init; not ported).

description: Z (button A) press at frame 30 → select countdown → dispatch at frame 44 → fade-out to in-game
rng_seed: 1
max_frames: 100
capture_frames: [0, 30, 35, 44, 50, 73, 74, 80, 85, 90, 95]
duration_ceiling_ms: 30000

# Zoomed-text companion: crop the right half of the screen — the
# main-menu items (NEW GAME / RANKING / OPTIONS / EXIT) plus the
# select-pulse highlight on NEW GAME at frame 44. Nearest-neighbor-
# scaled by 4 for pixel-accurate comparison against retail. See
# tools/scenario-test.py::render_sidebyside_zoom.
zoom_text:
  x: 480
  y: 300
  w: 360
  h: 280
  factor: 4
