# tools/heroes/heroes.yaml — recipe for the README hero SCREENSHOTS.
#
# Each entry is ONE OpenRecet screenshot (docs/img/<name>.png), written by
# tools/heroes/regen-heroes.py.  No side-by-side — the port is 1:1 on what we
# showcase, so a single faithful OpenRecet frame is the point.
#
# Fields per shot:
#   name      output basename -> docs/img/<name>.png                 (required)
#   source    "scenario" (real exe framebuffer, default) | "v3shot"
#             (Trace Studio v3 cache replay).  See regen-heroes.py header for
#             the trade-off (v3shot is fast/cache-backed but can't render
#             SetRenderTarget effects — use "scenario" for god-rays/backdrops).
#   scenario  scenario name (tests/scenarios/<scenario>/)            (required)
#   cap       [scenario] cap index into run.json captured_frames — anchor-
#             relative, so it frames the same beat across load-jitter.
#   frame     [scenario] explicit port frame number (overrides cap);
#             [v3shot] the kept-frame index to replay                (v3shot: required)
#   side      [v3shot] port|retail (default port)
#   window    [v3shot] OFFSET:COUNT slice of the scenario {caprange}, used by
#             --rerun to rebuild the port cache (port_capture.py).
#   anchor    [v3shot] anchor name for --rerun (default the scenario's own).
#   zoom      {x,y,w,h,factor} — crop + nearest-neighbour upscale (pixel-art
#             crisp).  Omit for the full 1024x768 frame.
#   note      human caption (passed to the feed --push).

shots:
  # 1. README top hero — iv1_2 opening dialogue over the LIVE house map.
  #    Shows the dialogue box, Tear's NAMEPLATE banner, both standees, the iv1_2
  #    magic-circle overlay FX, AND the top HUD (clock / Day / money) the engine
  #    draws over the map during iv1_2.
  #    Uses the intro-patience-settle scenario: it SETTLES on the "Patience,
  #    Recette…" line for ~2s so the speaker nameplate fully fades in (nalpha =
  #    (box_open-4)*60 ramps from TEXT_ANIM_END; at the per-line +2 capture in
  #    intro-dialogue-lines it was still at ~0 alpha → invisible).  cap 21 =
  #    TEXT_ANIM_END +120 (the nameplate fully up).  Verified 1:1 vs retail.
  #    FAITHFUL source: the magic-circle is a transparency/overlay effect, so
  #    this MUST be the real framebuffer (a v3 replay would risk an RT gap).
  - name: hero-iv1_2-dialogue
    source: scenario
    scenario: intro-patience-settle
    cap: 21
    note: "iv1_2 dialogue ('Patience, Recette…') — Tear nameplate, magic-circle FX, top HUD over the live HOUSE map"

  # 2. HOUSE free-roam — the 3D shop interior from the angled camera, Recette
  #    idle, the persistent top HUD, the "Change Camera" hint, and a back-window
  #    NPC drifting past.  cap 0 = the NPC-visible idle beat (phase-pinned).
  - name: hero-house-freeroam
    source: scenario
    scenario: house-idle-npc-drift
    cap: 0
    note: "HOUSE free-roam: 3D shop (geometry/lighting/god-rays), Recette idle, top HUD, Change-Camera hint, back-window NPC"

  # 3. In-shop price-HAGGLE UI — the customer-service negotiation: the BARGAIN
  #    gauge, the item's base price, Recette + the customer, and the "Item
  #    Details" hint.  From the house-customer-tutorial {caprange}; frame 2920 =
  #    the first haggle-UI open (raw frame, == offset 2440 from HOUSE_FREEROAM).
  #    v3shot: this frame has no RT-backed backdrop, so it replays faithfully;
  #    --rerun rebuilds the port cache via port_capture.py (no Frida).
  - name: hero-haggle
    source: v3shot
    scenario: house-customer-tutorial
    side: port
    frame: 2920
    window: "2000:1200"
    note: "in-shop price-haggle UI: BARGAIN gauge, item base price, customer, Item-Details hint"
