# tools/heroes/heroes.yaml — recipe for the README hero comparison images.
#
# Each entry is one labelled OpenRecet|Retail montage (docs/img/<name>.png),
# composed from a deterministic scenario both-run by tools/heroes/regen-heroes.py.
#
# Frame selection is by *cap index* (the anchor-relative capture order in
# run.json's captured_frames), NOT by raw frame number — cap index is stable
# across load-frame jitter, so the same index frames the same beat on both
# targets. The script maps cap -> captured_frames[cap] per side.
#
# Fields per shot:
#   name        output basename -> docs/img/<name>.png        (required)
#   scenario    scenario name; latest runs/scenarios/<s>-both-* is used
#               unless `run_dir` pins an exact directory       (required)
#   cap         cap index into captured_frames (both sides)    (required unless
#               port_frame/retail_frame given)
#   port_frame  explicit openrecet frame number (overrides cap)
#   retail_frame explicit retail frame number (overrides cap)
#   run_dir     pin an exact both-run dir (else newest glob match)
#   labels      "left,right"  (default "OpenRecet,Retail")
#   zoom        {x,y,w,h,factor} — identical crop applied to both, then
#               nearest-neighbour upscale (pixel-art crisp). Omit for full frame.
#   note        human caption (passed to the feed push)

shots:
  # 1. HOUSE hero — Recette idling at the bottom (NOT walking), a back-window NPC
  #    on screen, HUD + Change-Camera hint, FPS counter VISIBLE (--show-fps both).
  #    Needs the house-idle scenario (2nd HOUSE_FREEROAM anchor + offset). The
  #    run_dir is pinned once a good idle+NPC both-run exists.
  - name: house-comparison
    scenario: house-idle
    run_dir: runs/scenarios/house-idle-both-20260602T232424Z
    cap: 2               # +5000: port 3-NPC beat (user-pointed), Recette idle, HUD+hint+FPS
    note: "HOUSE free-roam: Recette idle, back-window NPCs, HUD + camera hint, FPS shown"

  # 2. iv1_1 first dialogue + the "sigh" (tameiki, chr:6) extra sprite. NO HUD
  #    (full-bg cutscene). cap 2 = the EXTRA_SPRITE FADED_IN peak.
  - name: hero-iv1_1-sigh
    scenario: intro-sigh
    run_dir: runs/scenarios/intro-sigh-both-20260602T123436Z
    cap: 2
    note: "iv1_1 dialogue + 'sigh' (tameiki, chr:6) effect sprite at fade-in peak"

  # 3. Recette look-up pose (iv1_2 opening) — zoomed onto her freeroam sprite.
  #    cap 3 = eyes-open look-up (cap 4 = blink). Zoom mirrors the scenario's
  #    zoom_text crop so the pose reads in a thumbnail.
  - name: hero-iv1_2-pose
    scenario: intro-iv2-gap
    run_dir: runs/scenarios/intro-iv2-gap-both-20260602T155646Z
    cap: 3
    zoom: {x: 520, y: 578, w: 104, h: 150, factor: 4}
    note: "iv1_2 opening: Recette look-up pose (eyes open), zoomed onto her sprite"

  # 4. iv1_2 second dialogue + an extra sprite, WITH the HUD (iv1_2 overlays the
  #    live HOUSE map -> top HUD shows). Needs a full-screen (non-zoomed) iv1_2
  #    frame carrying an EXTRA_SPRITE. run_dir/cap pinned once captured.
  - name: hero-iv1_2-dialogue
    scenario: intro-dialogue-lines
    run_dir: runs/scenarios/intro-dialogue-lines-both-20260602T235052Z
    cap: 18              # first-iv1_2 lines (HUD onset, cap16-19 align port=retail);
                         # Recette pointing pose. HUD visible on both (bgset gate fix).
    note: "iv1_2 second dialogue, HOUSE top HUD visible (clock/Day/money) over the live map"
